<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5f8b">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Exam Finder">
<title>Focused Exam Finder</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1f23;--mut:#666b73;--line:#e3e1da;--acc:#1f5f8b;--acc2:#e8f0f6;--warn:#8a3b12;--ok:#2d6a3e}
@media (prefers-color-scheme:dark){:root{--bg:#15171a;--card:#1e2125;--ink:#e9e7e2;--mut:#9aa0a8;--line:#30343a;--acc:#7fb4dc;--acc2:#1f2d38;--warn:#e0a47e;--ok:#8fd0a0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{position:sticky;top:0;padding-top:max(12px,env(safe-area-inset-top));z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px 10px}
.wrap{max-width:860px;margin:0 auto}
h1{font-size:18px;margin:0 0 2px;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:12.5px;margin:0 0 10px}
.searchrow{display:flex;gap:8px}
#q{flex:1;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
#q:focus{outline:2px solid var(--acc);outline-offset:-1px}
.tabs{display:flex;gap:6px;margin-top:10px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{padding:14px 16px 60px}
.sys{margin:16px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 11px;font-size:14px;cursor:pointer;color:var(--ink);text-align:left}
.chip:hover{border-color:var(--acc)}
.chip small{color:var(--mut)}
.back{background:none;border:none;color:var(--acc);font-size:14px;padding:0;cursor:pointer;margin-bottom:8px}
h2{font-size:22px;margin:4px 0 2px;letter-spacing:-.01em}
.meta{color:var(--mut);font-size:13px}
.note{background:var(--acc2);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:14px}
h3{font-size:14px;margin:20px 0 8px;text-transform:uppercase;letter-spacing:.05em;color:var(--acc)}
.tech{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:6px 0;overflow:hidden}
.th{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;user-select:none}
.th input{width:18px;height:18px;flex:none;accent-color:var(--acc)}
.th .nm{flex:1;font-weight:550}
.th .pg{color:var(--mut);font-size:12px;white-space:nowrap}
.th .car{color:var(--mut);transition:transform .15s}
.tech.open .car{transform:rotate(90deg)}
.tb{display:none;padding:0 14px 12px 40px;font-size:14px}
.tech.open .tb{display:block}
.tb p{margin:6px 0}
.lbl{font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);display:block;margin-top:8px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.links a,.links span{font-size:13px;border:1px solid var(--line);border-radius:7px;padding:5px 9px;text-decoration:none;color:var(--acc)}
.links span{color:var(--ink)}
.tech.done .nm{color:var(--mut);text-decoration:line-through}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px}
td{padding:9px 11px;border-top:1px solid var(--line);vertical-align:top}
tr:first-child td{border-top:none}
td.dx{font-weight:600;width:30%}
td.p{color:var(--mut);font-size:12px;white-space:nowrap;width:1%}
.foot{color:var(--mut);font-size:12px;margin-top:26px;border-top:1px solid var(--line);padding-top:10px}
.prog{font-size:13px;color:var(--ok);margin-left:8px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.sbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
.empty{color:var(--mut);padding:20px 0}
mark{background:#ffe9a8;color:inherit;border-radius:2px}
@media (prefers-color-scheme:dark){mark{background:#5a4a14}}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Focused Exam Finder</h1>
  <p class="sub">Presenting complaint → what to examine. Built from Talley &amp; O'Connor's <i>Clinical Examination</i> (8th edn); page numbers are printed book pages.</p>
  <div class="searchrow"><input id="q" type="search" placeholder="Type a complaint, e.g. chest pain, vertigo, knee…" autocomplete="off"></div>
  <div class="tabs"><button class="tab on" data-v="c">Complaints</button><button class="tab" data-v="t">Techniques A–Z</button></div>
</div></header>
<main><div class="wrap" id="view"></div></main>
<script src="exam-data.js"></script>
<script>
const {GM, T, C} = window.EXAM_DATA;

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function pdfPage(p){const m=String(p).match(/\d+/);if(!m)return'';const b=+m[0];return b+(b<=618?26:79)}
function pgLabel(p){const pp=pdfPage(p);return `Talley p ${esc(p)}`+(pp?` · PDF p ${pp}`:'')}
let tab='c', checks={};
try{checks=JSON.parse(localStorage.getItem('fx-checks')||'{}')}catch(e){checks={}}
function saveChecks(){try{localStorage.setItem('fx-checks',JSON.stringify(checks))}catch(e){}}
const norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function scoreC(c,q){if(!q)return 1;const hay=norm([c.n,...c.a,c.sys].join(' '));const words=q.split(' ');let sc=0;for(const w of words){if(!w)continue;if(norm(c.n).startsWith(w))sc+=5;else if(hay.includes(' '+w)||hay.startsWith(w))sc+=3;else if(hay.includes(w))sc+=1;else return 0}return sc}
function techCard(id,ctx){const t=T[id];const key=ctx+'|'+id;const done=!!checks[key];
 const yt='https://www.youtube.com/results?search_query='+encodeURIComponent(t.n.replace(/\(.*?\)/g,'')+' examination technique');
 return `<div class="tech${done?' done':''}" data-id="${id}">
 <div class="th">${ctx?`<input type="checkbox" data-k="${esc(key)}" ${done?'checked':''} aria-label="Mark done">`:''}<span class="nm">${esc(t.n)}</span><span class="pg">p ${esc(t.p)}</span><span class="car">›</span></div>
 <div class="tb"><span class="lbl">How</span><p>${esc(t.how)}</p><span class="lbl">Look for / interpretation</span><p>${esc(t.look)}</p>
 <div class="links"><span>${pgLabel(t.p)}</span><a href="${GM[t.gm]}" target="_blank" rel="noopener">Step-by-step guide ↗</a><a href="${yt}" target="_blank" rel="noopener">Video search ↗</a></div></div></div>`}
function renderList(){const q=norm($('#q').value);
 if(tab==='t'){const ids=Object.keys(T).filter(k=>!q||norm(T[k].n+' '+T[k].how).includes(q)).sort((a,b)=>T[a].n.localeCompare(T[b].n));
  $('#view').innerHTML=ids.length?`<p class="meta">${ids.length} techniques — tap to expand.</p>`+ids.map(i=>techCard(i,'')).join(''):'<p class="empty">No technique matches.</p>';return}
 let list=C.map(c=>[c,scoreC(c,q)]).filter(x=>x[1]>0);
 if(!list.length){$('#view').innerHTML=`<p class="empty">No complaint matches “${esc($('#q').value)}”. Try a simpler word (e.g. “pain”, “swelling”), or browse the Techniques A–Z tab. Complaints not listed here aren't covered — check the textbook index.</p>`;return}
 if(q){list.sort((a,b)=>b[1]-a[1]);$('#view').innerHTML='<div class="chips">'+list.map(([c])=>`<button class="chip" data-c="${c.id}">${esc(c.n)} <small>· ${esc(c.sys)}</small></button>`).join('')+'</div>';return}
 const by={};for(const [c] of list){const k=c.sys.split(' / ')[0];(by[k]=by[k]||[]).push(c)}
 $('#view').innerHTML=Object.keys(by).map(s=>`<div class="sys">${esc(s)}</div><div class="chips">${by[s].map(c=>`<button class="chip" data-c="${c.id}">${esc(c.n)}</button>`).join('')}</div>`).join('')}
function renderC(id){const c=C.find(x=>x.id===id);if(!c){renderList();return}
 const all=c.s.flatMap(s=>s[1]);const n=all.filter(i=>checks[c.id+'|'+i]).length;
 $('#view').innerHTML=`<button class="back" id="back">‹ All complaints</button>
 <h2>${esc(c.n)}</h2><div class="meta">${esc(c.sys)} · Textbook: ${esc(c.refs)}<span class="prog" id="prog">${n?`${n}/${all.length} done`:''}</span></div>
 ${c.note?`<div class="note">${esc(c.note)}</div>`:''}
 <div class="btnrow"><button class="sbtn" id="expand">Expand all</button><button class="sbtn" id="reset">Clear ticks</button><button class="sbtn" id="copy">Copy checklist</button></div>
 ${c.s.map(([title,ids])=>`<h3>${esc(title)}</h3>`+ids.map(i=>techCard(i,c.id)).join('')).join('')}
 <h3>Signs that point to each diagnosis</h3>
 <table>${c.dx.map(d=>`<tr><td class="dx">${esc(d[0])}</td><td>${esc(d[1])}</td><td class="p">p ${esc(d[2])}</td></tr>`).join('')}</table>
 <p class="foot">Summarised in my own words from Talley &amp; O'Connor (8th edn). Always read the cited pages; "Step-by-step guide" links go to Geeky Medics OSCE guides, which may differ in detail from the textbook. "Video search" opens a YouTube search, not a vetted video.</p>`;
 window.scrollTo(0,0)}
function route(){const h=location.hash.replace('#','');if(h.startsWith('c-'))renderC(h.slice(2));else renderList()}
document.addEventListener('click',e=>{
 const chip=e.target.closest('[data-c]');if(chip){location.hash='c-'+chip.dataset.c;return}
 if(e.target.id==='back'){location.hash='';history.replaceState(null,'',location.pathname+location.search);renderList();return}
 if(e.target.matches('input[type=checkbox][data-k]')){const k=e.target.dataset.k;if(e.target.checked)checks[k]=1;else delete checks[k];saveChecks();e.target.closest('.tech').classList.toggle('done',e.target.checked);const h=location.hash.slice(3),c=C.find(x=>x.id===h);if(c){const all=c.s.flatMap(s=>s[1]);const n=all.filter(i=>checks[c.id+'|'+i]).length;$('#prog').textContent=n?`${n}/${all.length} done`:''}return}
 const th=e.target.closest('.th');if(th){th.parentElement.classList.toggle('open');return}
 if(e.target.id==='expand'){const els=[...document.querySelectorAll('.tech')];const open=!els.every(x=>x.classList.contains('open'));els.forEach(x=>x.classList.toggle('open',open));e.target.textContent=open?'Collapse all':'Expand all';return}
 if(e.target.id==='reset'){const h=location.hash.slice(3);for(const k of Object.keys(checks))if(k.startsWith(h+'|'))delete checks[k];saveChecks();renderC(h);return}
 if(e.target.id==='copy'){const c=C.find(x=>x.id===location.hash.slice(3));if(!c)return;const txt=c.n+' — focused exam (Talley '+c.refs+')\n'+c.s.map(([t,ids])=>'\n'+t+'\n'+ids.map(i=>'☐ '+T[i].n+' (p '+T[i].p+')').join('\n')).join('\n');
  navigator.clipboard.writeText(txt).then(()=>{e.target.textContent='Copied ✓'},()=>{e.target.textContent='Copy blocked'});return}
 const tb=e.target.closest('.tab');if(tb){tab=tb.dataset.v;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===tb));if(location.hash){history.replaceState(null,'',location.pathname+location.search)}renderList()}
});
$('#q').addEventListener('input',()=>{if(location.hash)history.replaceState(null,'',location.pathname+location.search);renderList()});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'&&tab==='c'){const f=document.querySelector('[data-c]');if(f)location.hash='c-'+f.dataset.c}});
window.addEventListener('hashchange',route);route();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
