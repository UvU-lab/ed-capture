<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1f23;--mut:#666b73;--line:#e3e1da;--acc:#1f5f8b;--acc2:#e8f0f6;--warn:#8a3b12;--ok:#2d6a3e}
@media (prefers-color-scheme:dark){:root{--bg:#15171a;--card:#1e2125;--ink:#e9e7e2;--mut:#9aa0a8;--line:#30343a;--acc:#7fb4dc;--acc2:#1f2d38;--warn:#e0a47e;--ok:#8fd0a0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{position:sticky;top:0;padding-top:max(12px,env(safe-area-inset-top));z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px 10px}
.wrap{max-width:860px;margin:0 auto}
h1{font-size:18px;margin:0 0 2px;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:12.5px;margin:0 0 10px}
.searchrow{display:flex;gap:8px}
#q{flex:1;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
#q:focus{outline:2px solid var(--acc);outline-offset:-1px}
.tabs{display:flex;gap:6px;margin-top:10px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{padding:14px 16px 60px}
.sys{margin:16px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 11px;font-size:14px;cursor:pointer;color:var(--ink);text-align:left}
.chip:hover{border-color:var(--acc)}
.chip small{color:var(--mut)}
.back{background:none;border:none;color:var(--acc);font-size:14px;padding:0;cursor:pointer;margin-bottom:8px}
h2{font-size:22px;margin:4px 0 2px;letter-spacing:-.01em}
.meta{color:var(--mut);font-size:13px}
.note{background:var(--acc2);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:14px}
h3{font-size:14px;margin:20px 0 8px;text-transform:uppercase;letter-spacing:.05em;color:var(--acc)}
.tech{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:6px 0;overflow:hidden}
.th{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;user-select:none}
.th input{width:18px;height:18px;flex:none;accent-color:var(--acc)}
.th .nm{flex:1;font-weight:550}
.th .pg{color:var(--mut);font-size:12px;white-space:nowrap}
.th .car{color:var(--mut);transition:transform .15s}
.tech.open .car{transform:rotate(90deg)}
.tb{display:none;padding:0 14px 12px 40px;font-size:14px}
.tech.open .tb{display:block}
.tb p{margin:6px 0}
.lbl{font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);display:block;margin-top:8px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.links a,.links span{font-size:13px;border:1px solid var(--line);border-radius:7px;padding:5px 9px;text-decoration:none;color:var(--acc)}
.links span{color:var(--ink)}
.tech.done .nm{color:var(--mut);text-decoration:line-through}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px}
td{padding:9px 11px;border-top:1px solid var(--line);vertical-align:top}
tr:first-child td{border-top:none}
td.dx{font-weight:600;width:30%}
td.p{color:var(--mut);font-size:12px;white-space:nowrap;width:1%}
.foot{color:var(--mut);font-size:12px;margin-top:26px;border-top:1px solid var(--line);padding-top:10px}
.prog{font-size:13px;color:var(--ok);margin-left:8px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.sbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
.empty{color:var(--mut);padding:20px 0}
mark{background:#ffe9a8;color:inherit;border-radius:2px}
@media (prefers-color-scheme:dark){mark{background:#5a4a14}}
</style>

<body>
<header><div class="wrap">
  <h1>Focused Exam Finder</h1>
  <p class="sub">Presenting complaint → what to examine. Built from Talley &amp; O'Connor's <i>Clinical Examination</i> (8th edn); page numbers are printed book pages.</p>
  <div class="searchrow"><input id="q" type="search" placeholder="Type a complaint, e.g. chest pain, vertigo, knee…" autocomplete="off"></div>
  <div class="tabs"><button class="tab on" data-v="c">Complaints</button><button class="tab" data-v="t">Techniques A–Z</button></div>
</div></header>
<main><div class="wrap" id="view"></div></main>
<script>
// Source: Talley & O'Connor's Clinical Examination, 8th edn (2018). Page numbers = printed book pages.
// All text is paraphrased summary for personal study; consult the book for the full description.
const GM = {
  cvs:"https://geekymedics.com/cardiovascular-examination-2/",
  resp:"https://geekymedics.com/respiratory-examination-2/",
  abdo:"https://geekymedics.com/abdominal-examination/",
  pvd:"https://geekymedics.com/peripheral-vascular-examination/",
  dvt:"https://geekymedics.com/deep-vein-thrombosis-dvt-examination-osce-guide/",
  vv:"https://geekymedics.com/wp-content/uploads/2025/02/Varicose-Vein-Examination-OSCE-Checklist-Geeky-Medics.pdf",
  cn:"https://geekymedics.com/cranial-nerve-exam/",
  ul:"https://geekymedics.com/upper-limb-neurological-examination/",
  ll:"https://geekymedics.com/lower-limb-neurological-examination/",
  cereb:"https://geekymedics.com/wp-content/uploads/2025/02/Cerebellar-Examination-OSCE-Checklist-Geeky-Medics.pdf",
  hints:"https://geekymedics.com/the-head-impulse-nystagmus-test-of-skew-hints-examination/",
  dix:"https://geekymedics.com/dix-hallpike-and-epley-manoeuvres-osce-guide/",
  knee:"https://geekymedics.com/knee-examination/",
  shoulder:"https://geekymedics.com/shoulder-examination/",
  hip:"https://geekymedics.com/hip-examination/",
  spine:"https://geekymedics.com/spine-examination/",
  hand:"https://geekymedics.com/hand-examination/",
  ankle:"https://geekymedics.com/ankle-and-foot-examination/",
  elbow:"https://geekymedics.com/elbow-examination/",
  gals:"https://geekymedics.com/gals-assessment/",
  thyroid:"https://geekymedics.com/thyroid-status-examination/",
  neck:"https://geekymedics.com/neck-lump-examination-osce-guide/",
  testes:"https://geekymedics.com/testicular-examination-osce-guide/",
  hernia:"https://geekymedics.com/hernia-examination-osce-guide/",
  pr:"https://geekymedics.com/rectal-examination-pr/",
  breast:"https://geekymedics.com/breast-examination-osce-guide/",
  pv:"https://geekymedics.com/bimanual-vaginal-examination/",
  spec:"https://geekymedics.com/speculum-examination-osce-guide/",
  ear:"https://geekymedics.com/hearing-ear-examination-osce-guide/",
  nose:"https://geekymedics.com/nasal-examination-osce-guide/",
  ent:"https://geekymedics.com/category/osce/clinical-examination/ent/",
  eye:"https://geekymedics.com/eye-examination-osce-guide/",
  fundo:"https://geekymedics.com/fundoscopy-ophthalmoscopy-osce-guide/",
  abcde:"https://geekymedics.com/abcde-approach/",
  renal:"https://geekymedics.com/renal-system-examination-osce-guide/",
  neuro:"https://geekymedics.com/category/osce/clinical-examination/neuroosce/",
  obs:"https://geekymedics.com/category/osce/clinical-skills/patient-assessment/",
  skin:"https://geekymedics.com/wp-content/uploads/2025/02/Pigmented-Skin-Lesion-Examination-OSCE-Checklist-Geeky-Medics.pdf",
  other:"https://geekymedics.com/category/osce/clinical-examination/other/"
};

// Technique library
const T = {
 // ---------- General / vitals ----------
 vitals:{n:"Vital signs & general inspection",p:"121, 272",gm:"abcde",
  how:"Before touching, stand back: does the patient look unwell, distressed, sweaty, anxious or restless? Record pulse, BP, respiratory rate, temperature and SpO2, and repeat them at intervals so change can be tracked.",
  look:"Tachycardia, postural hypotension, tachypnoea, vasoconstriction and sweating together suggest volume loss or sepsis. A patient who looks sick usually is."},
 posturalbp:{n:"Lying and standing (postural) BP",p:"88, 276",gm:"obs",
  how:"Measure BP with the patient lying, then after standing for 1 minute.",
  look:"Systolic fall >15 mmHg or diastolic fall >10 mmHg = postural hypotension (commonly drugs, e.g. α-blockers). In GI bleeding a ≥15 mmHg postural systolic drop, pulse >100 or SBP <100 suggests severe recent blood loss."},
 bpboth:{n:"BP in both arms / radial pulse symmetry",p:"122",gm:"cvs",
  how:"Palpate both radial pulses together and measure BP in each arm.",
  look:"A weaker radial pulse on one side, or a ≥20 mmHg difference in BP between arms, is significant in suspected aortic dissection (specific but not sensitive)."},
 radiofem:{n:"Radiofemoral delay",p:"145–146",gm:"cvs",
  how:"Feel the radial and femoral pulses at the same time and compare timing.",
  look:"Delay of the femoral pulse suggests coarctation; listen over the back for a coarctation murmur."},
 pulsusp:{n:"Pulsus paradoxus",p:"88, 123, 202",gm:"cvs",
  how:"Lower the cuff slowly: note the pressure where Korotkoff sounds are first heard only intermittently (in expiration), then where they are heard with every beat. The difference is the pulsus paradoxus.",
  look:">10 mmHg inspiratory fall is abnormal: tamponade, constrictive pericarditis, severe asthma (>20 mmHg in severe asthma)."},
 crt:{n:"Capillary refill",p:"113, 868",gm:"pvd",
  how:"Press the finger or toe nail until it blanches, release, and time the return of colour.",
  look:"Slow return suggests poor peripheral perfusion (shock, peripheral arterial disease)."},
 // ---------- CVS ----------
 hands_cvs:{n:"Hands (CVS)",p:"145–146",gm:"cvs",
  how:"Take the right hand: feel the radial pulse while inspecting each nail bed of both hands for clubbing and splinter haemorrhages; look for Osler's nodes, Janeway lesions, peripheral cyanosis and tendon xanthomata.",
  look:"Stigmata of infective endocarditis (splinters common, Osler/Janeway rare); xanthomata in type II hyperlipidaemia."},
 jvp:{n:"Jugular venous pressure",p:"90–92, 146",gm:"cvs",
  how:"Patient at 45°, head on pillows, good lighting, head turned slightly left. Use the right internal jugular vein. Measure the vertical height of the top of the pulsation above the sternal angle. Confirm it is venous: double waveform, falls with inspiration, obliterated then fills from above with light pressure at the base of the neck. Watch for a change with inspiration (Kussmaul's sign).",
  look:">3 cm above the sternal angle = raised right-heart filling pressure (RV failure, volume overload, pericardial disease). Kussmaul's sign: RV infarction, constriction. Large v waves: tricuspid regurgitation."},
 hjr:{n:"Abdominojugular reflux",p:"120, 147",gm:"cvs",
  how:"With the JVP visible at 45°, apply firm pressure over the abdomen/liver and watch the JVP.",
  look:"A sustained rise supports heart failure (LR+ 6.4 for LVF in a dyspnoeic patient)."},
 carotid:{n:"Carotid pulse character & bruits",p:"146–147, 609",gm:"cvs",
  how:"Feel each carotid separately (never both together) to assess pulse character. Auscultate over the carotids.",
  look:"Slow-rising pulse and radiating murmur in aortic stenosis; carotid bruit as a possible embolic source."},
 apex:{n:"Praecordium: inspection & palpation",p:"146",gm:"cvs",
  how:"Inspect for scars (including lateral mitral valvotomy scars under the left breast), deformity, pacemaker, visible pulsations. Count interspaces to locate the apex (normal 5th left space, 1 cm medial to midclavicular line) and assess its character. Feel with the heel of the hand at the left sternal edge for a parasternal impulse and at the base for P2 and thrills.",
  look:"Pressure-loaded (sustained, not displaced): AS, hypertension. Volume-loaded (displaced, unsustained): AR, MR. Dyskinetic: heart failure. Tapping: MS. Double/triple impulse: HCM. Parasternal heave: RV enlargement."},
 ausc_cvs:{n:"Cardiac auscultation incl. dynamic manoeuvres",p:"146–147",gm:"cvs",
  how:"Mitral area with bell and diaphragm, then left sternal edge, then aortic and pulmonary areas; time each part of the cycle with the carotid. Then left lateral position (re-feel apex, listen), and sitting forward in full expiration (AR, pericardial rub). Perform Valsalva whenever there is a pure systolic murmur.",
  look:"S3 (LR+ 11 for LVF), S4, new murmurs; Valsalva reveals HCM, which is otherwise easily missed."},
 rub:{n:"Pericardial friction rub",p:"122",gm:"cvs",
  how:"Sit the patient up and listen with the breath held in deep expiration.",
  look:"Acute pericarditis (viral, post-MI, uraemia, malignancy, connective tissue disease…)."},
 backcvs:{n:"Back & bases (sitting forward)",p:"147",gm:"cvs",
  how:"Percuss the back for effusion, listen for inspiratory crackles, feel for sacral oedema, note deformity (e.g. ankylosing spondylitis).",
  look:"Basal crackles/effusion of LVF; sacral oedema."},
 oedema:{n:"Peripheral & sacral oedema",p:"120, 147, 318",gm:"cvs",
  how:"Press firmly over the shins/ankles and sacrum and look for pitting; note extent and whether unilateral or bilateral.",
  look:"Bilateral pitting: heart failure, nephrotic syndrome, liver disease. Unilateral: DVT, venous disease. Brawny, slow-pitting oedema: chronic venous stasis."},
 killip:{n:"Killip class (from the exam)",p:"121",gm:"cvs",
  how:"In suspected MI, grade from lung crackles and BP: I none; II crackles ≤ lower third, SBP >90; III crackles >1/3 of chest; IV cardiogenic shock (SBP <90).",
  look:"Class III–IV carries >5× mortality vs class I."},
 tamponade:{n:"Signs of tamponade",p:"123",gm:"cvs",
  how:"Check pulse, BP, pulsus paradoxus, JVP (prominent x, absent y descent), apex beat, heart sounds and the left base.",
  look:"Tachycardia, hypotension, pulsus paradoxus, raised JVP, impalpable apex, muffled heart sounds, dull left base with bronchial breathing."},
 ie_stigmata:{n:"Infective endocarditis screen",p:"123, 147",gm:"cvs",
  how:"Look for fever, pallor, splinters, clubbing, Osler's nodes, Janeway lesions, IV drug use marks, conjunctival haemorrhages, Roth's spots on fundoscopy, murmurs, splenomegaly, emboli; test urine for blood.",
  look:"A new or changing murmur with fever and these stigmata."},
 // ---------- PVD ----------
 pulses_leg:{n:"Peripheral pulses & femoral bruits",p:"113–114",gm:"pvd",
  how:"Palpate and then auscultate both femoral arteries. Palpate popliteal (supine; or prone with knee flexed if difficult), posterior tibial (behind medial malleolus) and dorsalis pedis on both sides.",
  look:"Absent femoral pulse LR+ 5.8; limb bruit LR+ 5.7; absent DP/PT LR+ 3.7 for peripheral vascular disease."},
 legs_pvd:{n:"Inspect legs for ischaemia",p:"113–114",gm:"pvd",
  how:"Look at both legs and feet: atrophic skin, hair loss, colour (pale, red, blue), ulcers, one foot cooler.",
  look:"Sores/ulcers on feet LR+ 5.9; one foot cooler LR+ 5.9. Arterial ulcers are punched out with cold skin; venous ulcers irregular with warm skin and oedema; neuropathic ulcers painless with reduced sensation."},
 buerger:{n:"Buerger's test",p:"113",gm:"pvd",
  how:"Elevate the legs to 45°, then hang them dependent at 90° over the edge of the bed.",
  look:"Rapid pallor on elevation and cyanosis on dependency = impaired arterial supply. Normal: no colour change."},
 abi:{n:"Ankle–brachial index",p:"113",gm:"pvd",
  how:"Doppler systolic pressure at DP or PT (cuff on calf) divided by brachial systolic pressure.",
  look:"<0.9 significant arterial disease; 0.4–0.9 claudication; <0.4 critical ischaemia; >1.3 calcified vessels."},
 sixPs:{n:"Acute limb ischaemia — the six Ps",p:"114",gm:"pvd",
  how:"Assess pain, pulses, pallor, paralysis, perishing cold and paraesthesia; then look for the embolic source (AF, recent MI, dilated cardiomyopathy, endocarditis).",
  look:"Painful, pulseless, pale, paralysed, cold limb with paraesthesia."},
 dvt:{n:"DVT examination",p:"115",gm:"dvt",
  how:"Look for calf and thigh swelling and dilated superficial veins; feel for warmth; gently squeeze the calf for tenderness. Homans' sign is of little value and theoretically risky.",
  look:"Clinical diagnosis is difficult; absence of signs does not exclude DVT."},
 varicose:{n:"Varicose vein examination",p:"115–116",gm:"vv",
  how:"Patient standing, legs exposed: inspect long saphenous (groin to medial leg) and short saphenous (back of calf) territories; look for inflammation, swelling, pigmentation. Palpate veins (hard = thrombosis, tender = thrombophlebitis). Cough impulse at the saphenous opening. Trendelenburg and Perthes' tests if required.",
  look:"Thrill on coughing = incompetent saphenofemoral valve. Unusual pattern (e.g. pubic varices) — consider pelvic obstruction: do rectal and pelvic exams."},
 // ---------- Respiratory ----------
 inspect_resp:{n:"General inspection (respiratory)",p:"201–202",gm:"resp",
  how:"Watch as the patient walks/undresses. Count the respiratory rate; look at accessory muscle use, intercostal in-drawing, paradoxical abdominal motion, cachexia. Ask to see the sputum mug. Note cough type and voice.",
  look:"Purulent sputum = infection (large volumes: bronchiectasis); haemoptysis; bovine cough (recurrent laryngeal palsy); hoarseness."},
 distress:{n:"Signs of respiratory distress / failure",p:"190, 870",gm:"abcde",
  how:"Look for cyanosis/low SpO2, accessory muscles, inability to speak, very fast or slow rate, exhaustion, silent chest, stridor, drowsiness, chest injury, tachycardia, pulsus paradoxus.",
  look:"Any of these indicates an urgent problem."},
 hands_resp:{n:"Hands (respiratory)",p:"201–202",gm:"resp",
  how:"Look for clubbing, peripheral cyanosis, tar staining, wasting of small hand muscles and weakness of finger abduction; palpate wrists for tenderness; feel pulse; outstretched hands for flapping tremor.",
  look:"Clubbing; brachial plexus involvement by lung cancer; HPOA (wrist tenderness); CO2 narcosis (flap). COPD does not cause clubbing."},
 face_resp:{n:"Face & eyes (Horner's, cyanosis)",p:"202, 778",gm:"resp",
  how:"Look for unilateral ptosis with a small reactive pupil, central cyanosis of the tongue, facial plethora.",
  look:"Horner's syndrome from an apical (Pancoast) lung cancer; plethora in SVC obstruction."},
 trachea:{n:"Trachea",p:"202",gm:"resp",
  how:"Palpate tracheal position carefully; look and feel for a tracheal tug.",
  look:"Displacement → concentrate on upper lobes; tug = severe airflow obstruction."},
 chest_exam:{n:"Chest: expansion, fremitus, percussion, auscultation",p:"202–203",gm:"resp",
  how:"Usually start at the back (elbows together to move scapulae). Palpate cervical nodes from behind. Upper lobe expansion by watching clavicles over the shoulders; lower lobe expansion by palpation. Vocal fremitus, percuss, then auscultate breath sounds (vesicular vs bronchial, intensity), added sounds and vocal resonance. Repeat on the front, high in the axillae; feel supraclavicular and axillary nodes.",
  look:"See the signs table: consolidation, collapse, effusion, pneumothorax, asthma, fibrosis each have a characteristic pattern (p 191)."},
 fet:{n:"Forced expiratory time",p:"202–203",gm:"resp",
  how:"Ask for a maximal inspiration then a fast, forceful full expiration through the open mouth while you listen and time it (stopwatch).",
  look:">3 s suggests obstruction; heavy smoking + FET ≥9 s is predictive of COPD (LR+ 9.6)."},
 peakflow:{n:"Peak expiratory flow",p:"203",gm:"resp",
  how:"Full breath in, then a rapid maximal puff into the meter; compare with tables for age, sex, height.",
  look:"Reduced and variable in asthma/COPD; best for serial monitoring."},
 corpulm:{n:"Signs of cor pulmonale",p:"203",gm:"resp",
  how:"Lie at 45°: JVP, praecordium (parasternal heave, loud P2), liver, leg oedema.",
  look:"Right heart failure secondary to lung disease."},
 pemberton:{n:"Pemberton's sign",p:"447–448",gm:"thyroid",
  how:"Ask the patient to raise both arms above the head, elbows by the ears, and keep them there for a full minute; watch the face and neck veins and listen for stridor.",
  look:"Facial plethora, cyanosis, venous distension or stridor = thoracic inlet obstruction (retrosternal goitre, SVC obstruction)."},
 // ---------- GI ----------
 gi_periph:{n:"Peripheral stigmata of liver disease",p:"275, 282–283",gm:"abdo",
  how:"Patient flat, one pillow. Look for jaundice, pigmentation, scratch marks, xanthomata. Hands: clubbing, leuconychia, palmar erythema, Dupuytren's, hepatic flap. Arms: bruising, spider naevi. Face: sclerae, Kayser–Fleischer rings, parotids, fetor. Chest: spider naevi, gynaecomastia, loss of body hair.",
  look:"Two or more of spider naevi, palmar erythema, ascites, firm hepatomegaly, abnormal collateral veins, encephalopathy strongly suggests cirrhosis."},
 flap:{n:"Asterixis (hepatic flap)",p:"236, 283",gm:"abdo",
  how:"Ask the patient to hold the arms out with wrists dorsiflexed and fingers spread; watch for irregular flapping.",
  look:"Hepatic encephalopathy, uraemia, CO2 retention."},
 mouth:{n:"Mouth inspection",p:"283, 793–794",gm:"ent",
  how:"Use a torch and spatula: lips, gums, tongue, buccal mucosa, palate, tonsils.",
  look:"Angular stomatitis, atrophic glossitis (iron/B12), ulcers, candida, telangiectasia, gum hypertrophy, pigmentation."},
 abdo_inspect:{n:"Abdominal inspection",p:"283",gm:"abdo",
  how:"Squat to the patient's level and look across the abdomen during slow deep breaths, then stand: scars, distension, prominent veins (check direction of flow), striae, bruising, pigmentation, hernias, visible peristalsis.",
  look:"Visible peristalsis LR+ 18.8 and distension LR+ 9.7 for bowel obstruction."},
 abdo_palp:{n:"Abdominal palpation (light then deep)",p:"283–284",gm:"abdo",
  how:"Ask first where it is tender and examine that area last. Light palpation of each region, then deep palpation for masses and organomegaly. Watch the patient's face throughout.",
  look:"Tenderness, guarding, rigidity, masses."},
 liver:{n:"Liver palpation & span",p:"250–251, 283–284",gm:"abdo",
  how:"Start in the right iliac fossa with the hand parallel to the costal margin. Patient breathes slowly through the mouth; advance 1–2 cm with each expiration, keep still during inspiration and wait for the edge. Define the upper border by percussion (normally 6th space, MCL) and estimate the span.",
  look:"Describe edge and surface: hard/soft, tender, regular/irregular, pulsatile (TR)."},
 spleen:{n:"Spleen palpation",p:"251, 284",gm:"abdo",
  how:"Two-handed: left hand behind the left lower ribs, right hand starting below the umbilicus parallel to the costal margin. If not felt, roll the patient onto the right side and repeat from near the costal margin. Percuss the lowest left intercostal space in the anterior axillary line in inspiration.",
  look:"Splenomegaly (haematological disease, portal hypertension, endocarditis, infection)."},
 kidneys:{n:"Ballotting the kidneys",p:"253, 284, 311",gm:"abdo",
  how:"Place one hand posteriorly at the renal angle (as far back as the spine) and the other anteriorly in the upper quadrant; flick the posterior fingers upwards and feel the kidney float up against the anterior hand.",
  look:"Enlarged kidney (e.g. polycystic disease, tumour, hydronephrosis); distinguish from spleen."},
 ascites:{n:"Ascites: flank dullness & shifting dullness",p:"258, 284",gm:"abdo",
  how:"Percuss from the midline out to each flank. Only if the flanks are dull: percuss away from you to the dull note, keep the finger there, roll the patient towards you, wait about a minute, and percuss again for resonance.",
  look:"Shifting dullness LR+ 5.8, fluid thrill LR+ 9.6, flank dullness LR+ 2.6; flank dullness appears with ≥2 L."},
 bowelsounds:{n:"Auscultation (bowel sounds, bruits, rubs)",p:"273–274, 284",gm:"abdo",
  how:"Listen for bowel sounds, then briefly over liver, spleen, renal areas and aorta for bruits, hums and rubs.",
  look:"Loud, frequent, high-pitched sounds in obstruction (LR+ 5.8); reduced/absent in ileus."},
 aorta:{n:"Palpate the abdominal aorta",p:"273, 284",gm:"abdo",
  how:"Deep palpation in the midline above the umbilicus.",
  look:"Expansile pulsatile mass = aneurysm; a ruptured AAA may be indistinct."},
 groin:{n:"Groin: nodes, hernial orifices, testes",p:"262–264, 284",gm:"hernia",
  how:"Palpate inguinal nodes; examine for hernias with the patient standing and coughing; examine the testes in males.",
  look:"A tender or irreducible hernia, especially new, is more likely significant."},
 periton:{n:"Assessing peritonism (cough, percussion, rebound)",p:"272–273",gm:"abdo",
  how:"Ask the patient to cough and watch the reaction; use light percussion over tender areas (kinder than rebound). If needed, elicit rebound slowly; do not repeat it.",
  look:"Rigidity LR+ 4.4, guarding LR+ 2.3, rebound LR+ 2.0 for peritonitis. Generalised peritonitis usually needs surgery (exception: pancreatitis)."},
 carnett:{n:"Carnett's test (abdominal wall pain)",p:"257, 272",gm:"abdo",
  how:"Find the localised tender spot that reproduces the pain, then have the patient tense the abdominal wall (e.g. lift head/shoulders) and press again.",
  look:"Increased or unchanged tenderness suggests abdominal wall pain (LR 0.08 for peritonitis when positive); can occasionally be positive with parietal peritoneal inflammation."},
 appendix:{n:"Appendicitis signs (McBurney, Rovsing, psoas)",p:"274",gm:"abdo",
  how:"McBurney's point: 3.8–5 cm along the line from ASIS to umbilicus. Rovsing's: press the left lower quadrant and release — pain in the right iliac fossa. Psoas: patient on left side, extend the right hip.",
  look:"Severe RLQ pain LR+ 7.3, McBurney tenderness LR+ 3.4, psoas LR+ 2.4; signs may be absent in the elderly."},
 murphy:{n:"Murphy's sign",p:"253",gm:"abdo",
  how:"Hand at the right costal margin; ask the patient to breathe in deeply (or stand behind and hook the hand under the costal margin).",
  look:"Patient catches breath as the inflamed gallbladder meets the hand: cholecystitis."},
 pr:{n:"Rectal examination",p:"264–267",gm:"pr",
  how:"Consent and chaperone; left lateral position, knees drawn up. Inspect the perianal area (straining if needed), then palpate with a lubricated gloved finger around the rectum; note tone, masses, prostate, tenderness; inspect the glove.",
  look:"Thrombosed piles, tags, prolapse, fissure (usually posterior midline), fistula, warts, carcinoma; melaena (LR 25 for upper GI bleed); fresh blood, mucus."},
 vomitus:{n:"Inspect vomitus / stool; urinalysis",p:"274, 284",gm:"abdo",
  how:"Look at any specimens available; dipstick the urine.",
  look:"Glycosuria/ketonuria (DKA), haematuria (renal colic), bilirubinuria (cholangitis), proteinuria (pyelonephritis)."},
 hernia:{n:"Hernia examination",p:"262–264",gm:"hernia",
  how:"Stand the patient, expose thigh to upper abdomen. Ask them to point to the lump. Inspect both sides; ask them to turn the head and cough while you watch the pubic tubercle region; palpate for an expansile cough impulse. Lie supine and repeat; do not reduce while standing. Relate to the pubic tubercle; in males examine the scrotum.",
  look:"Inguinal: above the ligament, medial to the tubercle. Femoral: below the ligament, lateral to the tubercle; small, firm, often irreducible, rarely a cough impulse. Can get above a hydrocele but not a hernia."},
 // ---------- GU ----------
 ckd_exam:{n:"Renal / CKD examination",p:"317–318",gm:"renal",
  how:"Ask if comfortable lying flat. Note mental state, sallow tinge, hydration, hyperventilation/hiccups. Nails (leuconychia, Muehrcke's, half-and-half), AV fistula, asterixis, bruising, tophi. Eyes, mouth, vasculitic rash, JVP, carotid bruits. Abdomen: dialysis/transplant scars, kidneys, bladder, ascites, renal bruits; rectal for prostate. Back tenderness, sacral oedema; heart (pericarditis, failure), lungs; legs (oedema, neuropathy).",
  look:"Finish with urinalysis, lying/standing BP and fundoscopy."},
 bladder:{n:"Percuss the bladder",p:"311, 318",gm:"abdo",
  how:"Percuss down from the umbilicus towards the symphysis; auscultatory percussion (stethoscope just above the symphysis) helps in obesity/ascites.",
  look:"Suprapubic dullness = distended bladder (retention)."},
 renalangle:{n:"Back / renal angle tenderness",p:"318",gm:"renal",
  how:"Sit the patient up; palpate (and gently percuss) the renal angles; check for sacral oedema.",
  look:"Tenderness with fever suggests pyelonephritis."},
 urinalysis:{n:"Urinalysis",p:"318",gm:"renal",
  how:"Dipstick for specific gravity, pH, glucose, blood, protein, leucocytes.",
  look:"Blood: nephritis, infection, stone, endocarditis; protein: nephritis/nephrotic; glucose: diabetes."},
 scrotum:{n:"Scrotal & testicular examination",p:"313–314",gm:"testes",
  how:"Gloves. Inspect genitals and scrotum standing. Palpate each testis gently; then the epididymis posteriorly and the cord. For a mass: can you get above it? Is it part of or separate from the testis? Transilluminate with a torch in a dark room.",
  look:"Can't get above → inguinoscrotal hernia. Solid, part of testis → tumour. Cystic with testis inside → hydrocele. Separate & transilluminates → epididymal cyst. Bag of worms → varicocele. Torsion: testis high and transverse. Exquisitely tender → orchitis."},
 maleGU:{n:"Penis / urethral discharge",p:"313",gm:"testes",
  how:"Gloves; retract the foreskin, inspect the glans for ulceration; look for discharge (milk the shaft if there is a history of discharge).",
  look:"Ulcers: herpes (tender), syphilis (non-tender), malignancy, reactive arthritis, Behçet's. Send any discharge for culture."},
 // ---------- Haem ----------
 haem_exam:{n:"Haematological examination",p:"348–349",gm:"other",
  how:"Lying flat: bruising (petechiae vs ecchymoses), pigmentation, rashes, ulcers, cyanosis/plethora, jaundice, scratch marks. Hands: koilonychia, palmar crease pallor, arthropathy. Epitrochlear and axillary nodes. Face: sclerae, mouth (gums, ulcers, glossitis). Cervical nodes from behind. Bony tenderness. Abdomen (liver, spleen, para-aortic, inguinal nodes, testes), rectal/pelvic. Legs: ulcers, vasculitis, neurology. Fundi, temperature, urine.",
  look:"Palmar crease pallor usually means Hb <70 g/L."},
 nodes:{n:"Lymph node examination",p:"339, 349",gm:"neck",
  how:"Cervical nodes from behind, patient sitting (8 groups: submental, submandibular, jugular chain, supraclavicular, posterior triangle, postauricular, preauricular, occipital); supraclavicular again from the front. Axillae (5 areas). Epitrochlear: elbow at 90°, thumb just proximal and anterior to the medial epicondyle. Inguinal (along ligament and femoral vessels). Examine the drainage area of any enlarged node.",
  look:"Describe site, size (>1 cm usually abnormal), consistency (hard: carcinoma; rubbery: lymphoma), tenderness (infection), fixation, overlying skin."},
 bonetender:{n:"Bony tenderness",p:"349",gm:"other",
  how:"Tap the spine with the fist; press the sternum, clavicles and shoulders; spring the hips.",
  look:"Expanding marrow (myeloma, carcinoma)."},
 pallor:{n:"Pallor: conjunctivae & palmar creases",p:"348, 773–776",gm:"eye",
  how:"Pull down the lower lid and compare the posterior conjunctiva with the pearly white anterior part; look at palmar creases.",
  look:"Loss of the normal contrast is a reliable sign of anaemia."},
 // ---------- Rheum / MSK ----------
 lfm:{n:"Joint examination principles: look, feel, move, measure",p:"372–374",gm:"gals",
  how:"Compare right with left; inspect from front, back and sides. LOOK: erythema, atrophy, scars, rashes, swelling, deformity, wasting. FEEL with the back of the fingers for warmth; tenderness (watch the face; grade I–IV); boggy synovitis vs fluctuant effusion vs hard bony swelling. MOVE: passive range (not if a fracture is possible), stability, crepitus; then active.",
  look:"Pain on active and passive movement → intra-articular. Pain on active only → periarticular. Active impaired but passive normal → soft tissue or neurological. An infected joint is very warm and extremely tender."},
 gals:{n:"GALS screen",p:"428–429",gm:"gals",
  how:"Gait (stride, turn, arm swing). From behind/side/front: spine, muscle bulk, lordosis/kyphosis, knee/foot deformity. Spine rotation, lateral flexion, neck movements. Shoulders (hand up back, hands behind head). Elbow extension. Hands: arms out, palms up/down, grip, finger–thumb opposition. Lying: leg length, knee flexion with crepitus, hip internal rotation. Feet: MTPs, bunions, calluses.",
  look:"Any abnormal joint → targeted detailed exam."},
 hands_rheum:{n:"Hands & wrists",p:"375–381",gm:"hand",
  how:"Sitting, hands on a pillow palms down. Look at wrists, MCPs, PIPs/DIPs, nails, then palms. Palpate wrists with both thumbs for synovitis/effusion, ulnar and radial styloids, snuff box, MCPs (at 90° flexion; rock for volar subluxation), IPs in two planes, palmar tendon crepitus. Active movements, function (grip, key grip, opposition, button/pen). Check elbows for nodules/psoriasis.",
  look:"DIPs spared → RA or SLE; DIPs involved → OA, gout, psoriatic. Ulnar deviation, swan neck, boutonnière, Z-thumb (RA); Heberden's/Bouchard's (OA); dactylitis, nail pitting/onycholysis (psoriatic); nail-fold infarcts (vasculitis). Radial styloid tenderness → de Quervain's; snuff box → scaphoid/1st CMC."},
 carpal:{n:"Carpal tunnel tests (Phalen's, Tinel's)",p:"380",gm:"hand",
  how:"Phalen's: flex both wrists for 30 seconds. Tinel's: tap over the flexor retinaculum (proximal palm).",
  look:"Paraesthesia in median distribution; Phalen's is more reliable than Tinel's."},
 elbow:{n:"Elbow",p:"383–384",gm:"elbow",
  how:"Expose arms; carrying angle. Look for effusion either side of the olecranon, nodules, tophi, bursa. Feel epicondyles; thumb along the ulnar shaft just distal to the olecranon, then fully extend (bulge = fluid). Move (flexion to 150°). For tennis elbow, resisted wrist extension and supination.",
  look:"Lateral/medial epicondyle tenderness = tennis/golfer's elbow. Early synovitis limits extension. Consider ulnar nerve exam."},
 shoulder:{n:"Shoulder",p:"384–388",gm:"shoulder",
  how:"Watch undressing; compare sides (deltoid vs trapezius wasting). Feel AC joint, clavicle, SC joint. Move: abduction (glenohumeral 90°, elevation 180°), adduction, external/internal rotation, flexion, extension; Apley scratch test as a screen. Special tests: apprehension and clunk tests (instability), resisted elbow flexion (biceps), drop-arm (supraspinatus tear), supraspinatus tendon palpation in extension, cross-arm (AC joint). Always examine neck and axillae.",
  look:"Painful arc 45–135° → rotator cuff. Painful limitation in all directions → intra-articular; one plane → tendinitis; painless weakness → tear or nerve lesion."},
 neck:{n:"Cervical spine",p:"391–392",gm:"spine",
  how:"Expose neck, shoulders and arms; note posture. Active flexion and extension (45°), lateral flexion (45°), rotation (70°). Palpate spinous processes (prone, neck slightly flexed) and facet joints a finger-breadth lateral. Spurling test; shoulder abduction relief test. Upper limb neuro exam.",
  look:"Spurling (extension + rotation to the affected side reproduces symptoms) is >90% specific for cervical root compression; placing the hand on the head relieves it."},
 back:{n:"Thoracolumbar spine & sacroiliac joints",p:"392–395",gm:"spine",
  how:"Standing in underwear: deformity from back and side (loss of kyphosis/lordosis, scoliosis). Feel each vertebra for tenderness and muscle spasm. Active flexion, extension, lateral bending, rotation (seated). Schober's test. Lying: straight leg raise with ankle dorsiflexion; compress ASISs (sacroiliac). Prone: gluteal wasting, palpate SI joints; side-lying pelvic pressure. Neuro exam of the legs.",
  look:"Schober increase <5 cm = reduced lumbar flexion (ankylosing spondylitis). SLR limited <60° with leg pain increased by dorsiflexion → root compression (sensitivity 91%)."},
 schober:{n:"Schober's test",p:"392–393",gm:"spine",
  how:"Mark the spine at the level of the posterior iliac spines (~L5); place fingers 5 cm below and 10 cm above; ask the patient to touch the toes.",
  look:"An increase of <5 cm in the distance indicates limited lumbar flexion."},
 slr:{n:"Straight leg raise (Lasègue)",p:"393, 610",gm:"spine",
  how:"Patient supine; lift the straightened leg (normally to 80–90°); ask where and when pain occurs; add passive ankle dorsiflexion.",
  look:"Ipsilateral leg pain limiting raise, worse with dorsiflexion → lumbosacral root compression."},
 hip:{n:"Hip",p:"395–397",gm:"hip",
  how:"Watch gait. Supine: scars, deformity, rotation. Feel just below the mid-inguinal ligament for joint tenderness; compare greater trochanter levels. Passive flexion (hold other leg down), Thomas's test, rotation at 90°/90°, abduction (steady the pelvis), adduction. FABER (figure-4). Prone: extension. Standing: Trendelenburg test. Measure true (ASIS–medial malleolus) and apparent (umbilicus–medial malleolus) leg length.",
  look:"OA restricts internal rotation, abduction and extension early. Fixed flexion deformity on Thomas's. Non-weight-bearing side sagging = positive Trendelenburg (hip disease or proximal myopathy). FABER: SI pain vs hip disease."},
 thomas:{n:"Thomas's test",p:"396",gm:"hip",
  how:"Fully flex both legs to flatten the lumbar lordosis, then extend one leg.",
  look:"Inability to straighten = fixed flexion deformity of that hip."},
 trendelenburg:{n:"Trendelenburg test",p:"397",gm:"hip",
  how:"Ask the patient to stand on one leg, then the other.",
  look:"Normally the non-weight-bearing side rises; it sags with hip disease or proximal myopathy."},
 knee:{n:"Knee",p:"399–403",gm:"knee",
  how:"Examine the normal knee first. Supine: quadriceps wasting, scars, swelling, deformity; squat to look for fixed flexion. Watch flexion/extension for patellar tracking. Feel warmth and synovium. Effusion: patellar tap (large), bulge sign (small). Slide patella sideways. Passive flexion (135°) and extension, crepitus, joint line tenderness. Collaterals (slight flexion, valgus/varus stress), cruciates at 90° (drawer; sit on foot), Lachman at 20–30°, patellar apprehension. Prone: popliteal fossa (Baker's), Apley grind/distraction. McMurray. Standing: varus/valgus; walk.",
  look:"Lachman LR+ 42, anterior drawer LR+ 37 for ACL tear; McMurray LR+ 8.9 for meniscal tear. >5–10° movement on ligament testing is abnormal. Swelling immediately after injury → haemarthrosis; after hours → meniscus. Ruptured Baker's cyst can mimic DVT."},
 lachman:{n:"Lachman test",p:"402",gm:"knee",
  how:"Supine, knee flexed 20–30°. Steady the femur above the knee; grasp the tibia below it and give a quick forward tug.",
  look:"Exaggerated anterior tibial movement or no firm end-point = ACL tear (LR+ 42)."},
 mcmurray:{n:"McMurray's test",p:"403",gm:"knee",
  how:"Supine; hold the ankle, other hand on the medial knee applying valgus force; extend from flexion while internally then externally rotating.",
  look:"Popping, possibly followed by inability to extend = meniscal tear."},
 ankle:{n:"Ankle & foot",p:"403–406",gm:"ankle",
  how:"Look at skin, swelling, scars, deformity (hallux valgus, clawing, sausage toes), nails, arches, calluses. Feel around the malleoli (posterior medial malleolus tenderness after injury suggests fracture). Move ankle (dorsiflexion 20°, plantar flexion 50°), subtalar (inversion/eversion — note pain), midtarsal (rotate forefoot). Squeeze MTPs. Press between 3rd/4th metatarsal heads (Morton's). Each IP joint. Achilles: nodules, tenderness, Simmonds' calf squeeze. Heel underside.",
  look:"Exquisitely tender red 1st MTP = gout. MTP squeeze tenderness = early RA. Foot fails to plantar flex on calf squeeze = Achilles rupture. Inferior heel tenderness = plantar fasciitis."},
 simmonds:{n:"Simmonds' (calf squeeze) test",p:"406",gm:"ankle",
  how:"Squeeze the calf (patient prone or kneeling) and watch the foot.",
  look:"No plantar flexion = ruptured Achilles tendon."},
 tmj:{n:"Temporomandibular joint",p:"388",gm:"gals",
  how:"Look in front of the ear for swelling; place a finger just in front of the ear while the patient opens and closes the mouth.",
  look:"Clicking, grating, tenderness (inflammatory arthritis, TMJ dysfunction)."},
 // ---------- Endocrine ----------
 thyroid:{n:"Thyroid gland examination",p:"444–448",gm:"thyroid",
  how:"Inspect front and sides of the neck (neck slightly extended); give a glass of water and watch the swelling as the patient swallows; ask them to protrude the tongue. Look for scars and dilated chest veins. Palpate from behind with the neck slightly flexed, one lobe at a time: size, lower border, shape, consistency, tenderness, mobility, thrill; repeat with swallowing. Cervical nodes; trachea from the front. Percuss the manubrium; auscultate each lobe for a bruit. Pemberton's sign.",
  look:"Goitre and thyroglossal cyst rise with swallowing; thyroglossal cyst rises with tongue protrusion. Stony hard, fixed nodule with nodes or cord palsy → carcinoma. Tenderness → thyroiditis. Absent lower border → retrosternal extension."},
 thyroidstatus:{n:"Thyroid status / endocrine screen",p:"448, 481",gm:"thyroid",
  how:"Hands: size, nails, tremor, palmar erythema, sweaty palms. Pulse (rate, AF) and BP. Proximal muscle weakness. Eyes: exophthalmos (look from above), lid lag, chemosis, ophthalmoplegia. Face/skin, axillary hair.",
  look:"Thyrotoxicosis: tremor, warm sweaty palms, tachycardia/AF, lid lag, proximal weakness."},
 // ---------- Neuro ----------
 higher:{n:"Orientation, speech & higher centres",p:"606–608",gm:"neuro",
  how:"Handedness, education; orientation to time, place, person. Ask the patient to name an object you point to, and point to a named object (dysphasia); say 'British Constitution' (dysarthria). Memory (3–5 words), parietal and frontal tests as indicated.",
  look:"Dysphasia localises to the dominant hemisphere; dysarthria may be cerebellar, bulbar or pseudobulbar."},
 meningism:{n:"Neck stiffness, Kernig's & Brudzinski's signs",p:"501, 608",gm:"neuro",
  how:"Patient flat: hand under the occiput, gently flex the neck (watch for spontaneous hip flexion = Brudzinski). Flex each hip with the knee bent and then try to straighten the knee (Kernig).",
  look:"Meningism (meningitis, subarachnoid haemorrhage). Diagnostic value is limited (combined LR+ 0.92, LR− 0.88), so a negative test does not exclude meningitis. Do not test neck if trauma is possible."},
 cn:{n:"Cranial nerve examination",p:"608–609",gm:"cn",
  how:"Sitting on the bed edge. Inspect for scars, asymmetry, ptosis, proptosis, pupil inequality. II: acuity (glasses on, each eye), fields by confrontation, fundi. III/IV/VI: pupils (direct, consensual, swinging-light for RAPD, accommodation), eye movements, nystagmus, diplopia. V: corneal reflex, facial sensation (3 divisions), masseters, jaw opening, jaw jerk. VII: forehead, eye closure, grin. VIII: whispered numbers at 60 cm; otoscopy; Dix–Hallpike if BPPV suspected. IX/X: uvula, palate, cough. XII: tongue wasting, fasciculation, deviation. XI: shrug, head turn. Then skull and carotid bruits.",
  look:"UMN facial weakness spares the forehead. Uvula pulls to the normal side; tongue deviates to the weak side; jaw deviates to the weak side."},
 pupils:{n:"Pupils & swinging-light test",p:"609, 603",gm:"cn",
  how:"Torch from the side: shape, size, ptosis, direct and consensual responses; swing the light in an arc pupil to pupil to look for an afferent defect; accommodation at ~30 cm.",
  look:"RAPD = optic nerve disease. One dilated pupil (unconscious): subdural, raised ICP/herniation, PComm aneurysm. Pinpoint: pontine lesion or opiates. Small reactive with ptosis: Horner's."},
 fields:{n:"Visual fields by confrontation",p:"608",gm:"eye",
  how:"Sit level with the patient's head at ~1 m; test each eye separately with a hat-pin or fingers; map fields with fingers if acuity is very poor.",
  look:"Hemianopia (cortical/parieto-occipital infarct) vs monocular loss."},
 fundoscopy:{n:"Fundoscopy",p:"776–777",gm:"fundo",
  how:"Dim room. Your right eye for their right eye. Start at +20 about 20 cm away (cornea), turn down to 0 as you move closer. Find a vessel and follow it to the disc; examine disc margin and colour, the vessels and retina; finally ask the patient to look at the light to see the macula.",
  look:"Papilloedema (blurred margin), optic atrophy (pale), haemorrhages (flame/blot/subhyaloid), diabetic and hypertensive changes (grades 1–4), CRAO (milky retina, thin arteries), CRVO (blood and thunder), detachment, Roth's spots."},
 eyemove:{n:"Eye movements & nystagmus",p:"609, 778",gm:"cn",
  how:"Both eyes follow a pin in each direction; test saccades horizontally and vertically; ask about diplopia in each direction; sustained upgaze ~30 s for fatigability.",
  look:"Failure of movement (III/IV/VI palsy), nystagmus, myasthenic fatigue with ptosis."},
 hit:{n:"Head impulse test",p:"517–518, 609",gm:"hints",
  how:"Patient fixes on a target (your nose). Make small, fast turns of the head side to side and watch the eyes. Do it horizontally if there is nystagmus that may be peripheral.",
  look:"With vestibular loss the eyes move with the head when turned toward the damaged side, followed by a catch-up saccade back to the target — typical of peripheral vestibular loss."},
 dix:{n:"Dix–Hallpike manoeuvre",p:"529–530, 609",gm:"dix",
  how:"Use only if vertigo is provoked by movement and there is no nystagmus at rest. Explain; sit the patient up; lie them back quickly with the head turned 45° to the side tested and hanging below horizontal (a pillow behind the back helps); eyes open.",
  look:"Positive (BPPV): after a short latency, waxing then waning nystagmus over seconds to a minute (posterior canal: upbeating-torsional, geotropic). No latency, no fatigue, persistent or variable nystagmus → consider brainstem/cerebellar lesion. Avoid if there is spontaneous nystagmus (will cause vomiting, unhelpful)."},
 hearing:{n:"Hearing, Rinne & Weber, otoscopy",p:"530, 785–788",gm:"ear",
  how:"Whisper numbers ~60 cm from each ear at end-expiration while masking the other ear, standing behind to stop lip reading. Rinne: 512 Hz fork on mastoid, then at the meatus. Weber: fork on the forehead midline. Otoscopy: pull the pinna up and back, steady the hand on the cheek.",
  look:"Conductive loss: Rinne negative, Weber to the affected ear. Sensorineural: Rinne positive, Weber to the normal ear. Note these are not good screening tests on their own."},
 ul_neuro:{n:"Upper limb neurological exam",p:"609–610",gm:"ul",
  how:"Shake hands. Inspect for wasting (including shoulder girdle) and fasciculation. Arms out, palms up, eyes closed: drift, tremor, pseudoathetosis. Bulk, tenderness. Tone at wrist and elbow at varying speeds. Power: shoulder, elbow, wrist, fingers (Froment's / pen-touching test if indicated). Reflexes biceps (C5,6), triceps (C7,8), brachioradialis (C5,6). Coordination: finger–nose, dysdiadochokinesis, rebound. Sensation: pinprick and cold (map dermatomes distal→proximal), vibration (128 Hz) and proprioception (DIP joint), bilateral touch for extinction. Thickened nerves, axillae, neck.",
  look:"Fit sensory loss to dermatome (root/cord), peripheral nerve, glove (neuropathy) or hemisensory (cortex/cord). Drift: UMN weakness, cerebellar or posterior column loss."},
 drift:{n:"Pronator drift",p:"609",gm:"ul",
  how:"Arms extended, palms up, eyes closed; watch for 20–30 seconds.",
  look:"Drift of one or both arms: UMN weakness, cerebellar lesion or posterior column loss."},
 ll_neuro:{n:"Lower limb neurological exam",p:"610",gm:"ll",
  how:"Gait and stance first. In bed, legs exposed, towel over groin (note catheter). Wasting, fasciculation, tremor; feel quadriceps and anterior tibial bulk. Tone at knee and ankle, test clonus (sharp push of patella downwards; sharp ankle dorsiflexion). Power at hip, knee, ankle. Reflexes knee (L3,4), ankle (S1,2), plantar (L5–S2). Coordination: heel–shin, toe–finger, foot tapping. Sensation as for arms; look for a sensory level up the trunk; saddle region and anal reflex (S2–4). Back: deformity, tenderness, bruits, SLR.",
  look:"Sustained clonus = UMN lesion. A sensory level indicates a cord lesion."},
 cerebellar:{n:"Cerebellar examination",p:"577, 607, 610",gm:"cereb",
  how:"Gait, turning, heel-to-toe walking; nystagmus; speech; finger–nose (intention tremor, past-pointing), dysdiadochokinesis, rebound; heel–shin; foot tapping.",
  look:"Ipsilateral limb signs with a hemisphere lesion; truncal/tandem gait ataxia with midline lesions."},
 romberg:{n:"Romberg test & gait",p:"577",gm:"cereb",
  how:"Watch gait, quick turn, heel-to-toe, toe-walking (S1), heel-walking (L4/5), squat-to-stand. Romberg: feet together, eyes open until stable, then eyes closed for up to 60 seconds; stand close.",
  look:"Positive Romberg (much worse with eyes closed) = proprioceptive loss. Marked unsteadiness with eyes open: severe proprioceptive loss, cerebellar or vestibular disease."},
 gcs:{n:"Glasgow Coma Scale & coma examination",p:"601–603",gm:"neuro",
  how:"ABC first. Breathing pattern (Cheyne–Stokes, ataxic, Kussmaul), circulation, posture (decerebrate/decorticate), involuntary movements. Level of consciousness (tickle nose; supraorbital pressure) and score GCS (eyes 4, motor 6, verbal 5). Neck (if no trauma), head injury signs (Battle's sign), pupils, fundi, eye position, doll's-eye reflex, ears/nose for CSF/blood, tongue/mouth (biting, corrosion, gum hyperplasia), breath smell.",
  look:"COMA mnemonic: CO2 narcosis, Overdose, Metabolic, Apoplexy. GCS ≤4 very poor prognosis; >11 good."},
 parkinson:{n:"Parkinsonism examination",p:"597–598",gm:"neuro",
  how:"Inspect for mask facies, flexed posture, few spontaneous movements. Rise from a chair, walk, turn quickly, stop and start; heel-to-toe. Bradykinesia: finger tapping, twiddling. Resting tremor at rest (enhance with serial 7s or moving the other hand). Tone at both wrists (reinforce by moving the other arm/head). Face: blinking, glabellar tap.",
  look:"Shuffling, festinant gait, reduced arm swing; asymmetrical pill-rolling rest tremor; cogwheel or lead-pipe rigidity."},
 // ---------- Eye / ENT ----------
 eye_exam:{n:"Eye examination (red / painful eye)",p:"774–778",gm:"eye",
  how:"Inspect redness distribution (peripheral vs around the cornea), discharge, cornea (fluorescein for ulcers), pupils (shape, reaction), acuity. Look from above for exophthalmos and test lid lag. Palpate orbits; feel the preauricular node.",
  look:"Conjunctivitis: peripheral redness, normal cornea and pupil. Iritis: ciliary flush, dull cornea, small irregular pupil. Acute glaucoma: dull cornea, mid-oval unreactive pupil, halos. Corneal ulcer: stains with fluorescein (dendritic in herpes). Preauricular node: adenoviral conjunctivitis."},
 acuity:{n:"Visual acuity",p:"608, 773",gm:"eye",
  how:"Each eye separately with spectacles on, other eye covered with a card; pinhole if reduced.",
  look:"Reduced acuity → localise with fields, pupils and fundoscopy."},
 nose:{n:"Nose & sinuses",p:"789–791",gm:"nose",
  how:"Inspect shape and deviation (from behind/above), periorbital swelling; press the tip up to view the nares. Palpate nasal bones and face; block each nostril and ask the patient to inhale. Nasal speculum: septum, mucosa colour, bleeding at Little's area, polyps, foreign body, discharge, turbinates. Test smell if anosmia. Sinus tenderness; transillumination.",
  look:"Bacterial sinusitis: biphasic illness, purulent discharge, unilateral maxillary tooth/facial pain and tenderness. Periorbital oedema, visual change or altered mental state → complicated sinusitis. Saddle nose: GPA, relapsing polychondritis."},
 throat:{n:"Mouth & throat",p:"792–795",gm:"ent",
  how:"Lips, buccal mucosa, parotid duct, teeth, gums, tongue (in mouth and protruded), floor of mouth, palate; palpate tongue and floor of mouth bimanually (gloved, protect your finger). 'Ah' with tongue depressor (not too far back): oropharynx, uvula, tonsils (size, membrane, pus). Salivary glands and cervical nodes.",
  look:"Centor features for strep pharyngitis: no cough, fever, pharyngeal exudate, anterior cervical nodes. Glandular fever: posterior cervical nodes (LR+ 3.1), palatal petechiae (LR+ 5.3), splenomegaly. Stridor, odynophagia, drooling → supraglottitis (urgent)."},
 // ---------- Women's health ----------
 breast:{n:"Breast examination",p:"764–766",gm:"breast",
  how:"Explain, offer a chaperone. Sitting, chest exposed: nipples (retraction, Paget's), skin (veins, dimpling, peau d'orange, erythema); arms raised then lowered; hands pressed on hips. Palpate supraclavicular and axillary nodes. Lying with the hand behind the head: palpate with the pulps of the middle three fingers in vertical strips over the area bounded by clavicle, sternum, midaxillary line and bra line; feel behind the nipple; finish sitting up with two hands.",
  look:"Describe any lump: position (clock face, distance from areola), size, shape, consistency, tenderness, fixation, single or multiple. Hard, irregular, fixed, with dimpling, nipple retraction or nodes → suspicious."},
 pelvic:{n:"Pelvic examination (speculum & bimanual)",p:"752–761",gm:"pv",
  how:"Only when indicated; consent, chaperone, privacy. Abdomen first (masses arising from the pelvis have no lower border above the pubis). Inspect vulva. Speculum before digital exam: view the cervix, discharge, bleeding, polyps; swabs/Pap as indicated; bear down/cough for prolapse. Bimanual: two fingers in the vagina, other hand suprapubic — uterus size, shape, consistency, position; pouch of Douglas; each lateral fornix for adnexal masses. Be gentle (e.g. suspected ectopic).",
  look:"Cervical motion tenderness LR 4.9, adnexal mass LR 2.4 for ectopic pregnancy. Tender, ill-defined mass with cervical excitation → tubo-ovarian abscess. Fixed uterus with posterior fornix nodules → endometriosis."},
 // ---------- Skin ----------
 skin:{n:"Dermatological examination",p:"802–804",gm:"skin",
  how:"Good light, patient undressed to underwear with a gown; examine all skin, mucosa, nails and hair even if one lesion is shown. Nails/hands, forearms, scalp, face, neck, trunk, buttocks/sacrum, legs, feet (between toes). For each lesion: morphology (correct terms), distribution, pattern (linear, annular etc.), then palpate texture, consistency, tenderness, temperature, depth, mobility.",
  look:"Palpable purpura = vasculitis. Distinguish primary lesions from secondary changes (excoriation, crusting, lichenification). Biopsy if unexplained."},
 lump:{n:"Assessing a lump",p:"804",gm:"neck",
  how:"Site, size, shape, consistency, mobility, tenderness; determine the tissue layer (moves with skin → epidermis/dermis; skin moves over it → subcutaneous; fixed with muscle contraction → muscle/tendon).",
  look:"Helps narrow the differential (cyst, lipoma, node, tumour)."},
 // ---------- Fever / acute ----------
 fever_exam:{n:"Examination for a source of fever",p:"835–836",gm:"other",
  how:"Temperature chart pattern; how ill; weight loss; rash. Hands (endocarditis, vasculitis, clubbing, arthropathy). Arms (injection sites, cannula sites), epitrochlear/axillary nodes. Temporal arteries; eyes (iritis, conjunctivitis, jaundice, fundi); mouth, teeth, tonsils, ears, parotids; cervical nodes; thyroid. Chest: bony tenderness, lungs, heart murmurs/rubs. Abdomen: rose spots, liver, spleen, kidneys, tenderness, testes, inguinal nodes; rectal and vaginal exam; genitals. CNS: meningism, focal signs.",
  look:"New fever in a hospital patient → remove the peripheral cannula and send the tip."},
 abcde:{n:"ABCDE assessment of the acutely ill",p:"867–870",gm:"abcde",
  how:"'Are you okay?' — if unresponsive check airway, breathing and circulation within ~10 s; start CPR if needed. AVPU then GCS if only responding to pain. Check glucose. AMPLE history. Vitals, fluid status, capillary refill, urine output.",
  look:"Signs of critical illness: stridor, RR >35 or <8, SpO2 <90% on O2, HR <40 or >180, SBP <100, poor perfusion, low urine output, GCS <10, new one-sided weakness, recurrent seizures."},
 delirium:{n:"Delirium screen",p:"867–870",gm:"abcde",
  how:"Ask relatives/staff about acute, fluctuating change, inattention, disorganised thinking, altered alertness. Examine for causes: infection (urine, chest), neuro signs, MI, drugs/withdrawal, metabolic (glucose, hypoxia), organ failure, urinary retention.",
  look:"Delirium is confirmed by acute fluctuating onset + inattention, plus disorganised thinking or altered alertness."}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function pdfPage(p){const m=String(p).match(/\d+/);if(!m)return'';const b=+m[0];return b+(b<=618?26:79)}
function pgLabel(p){const pp=pdfPage(p);return `Talley p ${esc(p)}`+(pp?` · PDF p ${pp}`:'')}
let tab='c', checks={};
try{checks=JSON.parse(localStorage.getItem('fx-checks')||'{}')}catch(e){checks={}}
function saveChecks(){try{localStorage.setItem('fx-checks',JSON.stringify(checks))}catch(e){}}
const norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function scoreC(c,q){if(!q)return 1;const hay=norm([c.n,...c.a,c.sys].join(' '));const words=q.split(' ');let sc=0;for(const w of words){if(!w)continue;if(norm(c.n).startsWith(w))sc+=5;else if(hay.includes(' '+w)||hay.startsWith(w))sc+=3;else if(hay.includes(w))sc+=1;else return 0}return sc}
function techCard(id,ctx){const t=T[id];const key=ctx+'|'+id;const done=!!checks[key];
 const yt='https://www.youtube.com/results?search_query='+encodeURIComponent(t.n.replace(/\(.*?\)/g,'')+' examination technique');
 return `<div class="tech${done?' done':''}" data-id="${id}">
 <div class="th">${ctx?`<input type="checkbox" data-k="${esc(key)}" ${done?'checked':''} aria-label="Mark done">`:''}<span class="nm">${esc(t.n)}</span><span class="pg">p ${esc(t.p)}</span><span class="car">›</span></div>
 <div class="tb"><span class="lbl">How</span><p>${esc(t.how)}</p><span class="lbl">Look for / interpretation</span><p>${esc(t.look)}</p>
 <div class="links"><span>${pgLabel(t.p)}</span><a href="${GM[t.gm]}" target="_blank" rel="noopener">Step-by-step guide ↗</a><a href="${yt}" target="_blank" rel="noopener">Video search ↗</a></div></div></div>`}
function renderList(){const q=norm($('#q').value);
 if(tab==='t'){const ids=Object.keys(T).filter(k=>!q||norm(T[k].n+' '+T[k].how).includes(q)).sort((a,b)=>T[a].n.localeCompare(T[b].n));
  $('#view').innerHTML=ids.length?`<p class="meta">${ids.length} techniques — tap to expand.</p>`+ids.map(i=>techCard(i,'')).join(''):'<p class="empty">No technique matches.</p>';return}
 let list=C.map(c=>[c,scoreC(c,q)]).filter(x=>x[1]>0);
 if(!list.length){$('#view').innerHTML=`<p class="empty">No complaint matches “${esc($('#q').value)}”. Try a simpler word (e.g. “pain”, “swelling”), or browse the Techniques A–Z tab. Complaints not listed here aren't covered — check the textbook index.</p>`;return}
 if(q){list.sort((a,b)=>b[1]-a[1]);$('#view').innerHTML='<div class="chips">'+list.map(([c])=>`<button class="chip" data-c="${c.id}">${esc(c.n)} <small>· ${esc(c.sys)}</small></button>`).join('')+'</div>';return}
 const by={};for(const [c] of list){const k=c.sys.split(' / ')[0];(by[k]=by[k]||[]).push(c)}
 $('#view').innerHTML=Object.keys(by).map(s=>`<div class="sys">${esc(s)}</div><div class="chips">${by[s].map(c=>`<button class="chip" data-c="${c.id}">${esc(c.n)}</button>`).join('')}</div>`).join('')}
function renderC(id){const c=C.find(x=>x.id===id);if(!c){renderList();return}
 const all=c.s.flatMap(s=>s[1]);const n=all.filter(i=>checks[c.id+'|'+i]).length;
 $('#view').innerHTML=`<button class="back" id="back">‹ All complaints</button>
 <h2>${esc(c.n)}</h2><div class="meta">${esc(c.sys)} · Textbook: ${esc(c.refs)}<span class="prog" id="prog">${n?`${n}/${all.length} done`:''}</span></div>
 ${c.note?`<div class="note">${esc(c.note)}</div>`:''}
 <div class="btnrow"><button class="sbtn" id="expand">Expand all</button><button class="sbtn" id="reset">Clear ticks</button><button class="sbtn" id="copy">Copy checklist</button></div>
 ${c.s.map(([title,ids])=>`<h3>${esc(title)}</h3>`+ids.map(i=>techCard(i,c.id)).join('')).join('')}
 <h3>Signs that point to each diagnosis</h3>
 <table>${c.dx.map(d=>`<tr><td class="dx">${esc(d[0])}</td><td>${esc(d[1])}</td><td class="p">p ${esc(d[2])}</td></tr>`).join('')}</table>
 <p class="foot">Summarised in my own words from Talley &amp; O'Connor (8th edn). Always read the cited pages; "Step-by-step guide" links go to Geeky Medics OSCE guides, which may differ in detail from the textbook. "Video search" opens a YouTube search, not a vetted video.</p>`;
 window.scrollTo(0,0)}
function route(){const h=location.hash.replace('#','');if(h.startsWith('c-'))renderC(h.slice(2));else renderList()}
document.addEventListener('click',e=>{
 const chip=e.target.closest('[data-c]');if(chip){location.hash='c-'+chip.dataset.c;return}
 if(e.target.id==='back'){location.hash='';history.replaceState(null,'',location.pathname+location.search);renderList();return}
 if(e.target.matches('input[type=checkbox][data-k]')){const k=e.target.dataset.k;if(e.target.checked)checks[k]=1;else delete checks[k];saveChecks();e.target.closest('.tech').classList.toggle('done',e.target.checked);const h=location.hash.slice(3),c=C.find(x=>x.id===h);if(c){const all=c.s.flatMap(s=>s[1]);const n=all.filter(i=>checks[c.id+'|'+i]).length;$('#prog').textContent=n?`${n}/${all.length} done`:''}return}
 const th=e.target.closest('.th');if(th){th.parentElement.classList.toggle('open');return}
 if(e.target.id==='expand'){const els=[...document.querySelectorAll('.tech')];const open=!els.every(x=>x.classList.contains('open'));els.forEach(x=>x.classList.toggle('open',open));e.target.textContent=open?'Collapse all':'Expand all';return}
 if(e.target.id==='reset'){const h=location.hash.slice(3);for(const k of Object.keys(checks))if(k.startsWith(h+'|'))delete checks[k];saveChecks();renderC(h);return}
 if(e.target.id==='copy'){const c=C.find(x=>x.id===location.hash.slice(3));if(!c)return;const txt=c.n+' — focused exam (Talley '+c.refs+')\n'+c.s.map(([t,ids])=>'\n'+t+'\n'+ids.map(i=>'☐ '+T[i].n+' (p '+T[i].p+')').join('\n')).join('\n');
  navigator.clipboard.writeText(txt).then(()=>{e.target.textContent='Copied ✓'},()=>{e.target.textContent='Copy blocked'});return}
 const tb=e.target.closest('.tab');if(tb){tab=tb.dataset.v;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===tb));if(location.hash){history.replaceState(null,'',location.pathname+location.search)}renderList()}
});
$('#q').addEventListener('input',()=>{if(location.hash)history.replaceState(null,'',location.pathname+location.search);renderList()});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'&&tab==='c'){const f=document.querySelector('[data-c]');if(f)location.hash='c-'+f.dataset.c}});
window.addEventListener('hashchange',route);route();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
